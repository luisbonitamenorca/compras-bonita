name: Ingesta de correo

# Vercel en plan Hobby solo permite un cron diario, que es insuficiente: los días
# de cierre de mes entran 40-50 facturas y una sola pasada no las despacha.
# GitHub Actions no tiene esa limitación, así que la llamada se hace desde aquí.
#
# Nota: el disparo programado de GitHub es "best effort" y puede retrasarse unos
# minutos cuando hay mucha carga. Para este uso da igual: lo que importa es que
# haya varias pasadas al día, no la puntualidad al segundo.

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:          # y un botón para lanzarla a mano cuando haga falta

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/ingesta-correo
        run: |
          echo "Llamando a la ingesta..."
          RESPUESTA=$(curl -sS --max-time 120 \
            -w "\nHTTP:%{http_code}" \
            https://compras-bonita.vercel.app/api/ingesta-correo)
          echo "$RESPUESTA"

          CODIGO=$(echo "$RESPUESTA" | tail -1 | cut -d: -f2)
          if [ "$CODIGO" != "200" ]; then
            echo "::error::La ingesta respondió $CODIGO"
            exit 1
          fi

          # Si quedan pendientes, se avisa en el resumen del run para que se vea
          # sin tener que abrir la app.
          echo "$RESPUESTA" | head -1 >> $GITHUB_STEP_SUMMARY
